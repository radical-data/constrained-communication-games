services:
  api:
    build: ./api
    ports:
      - "3001:3000"
    restart: always
    networks:
      - ccg-network
    environment:
      - NODE_ENV=production
      - PORT=3000

  web:
    build: ./web
    ports:
      - "4173:4173"
    restart: always
    networks:
      - ccg-network
    environment:
      - NODE_ENV=production
      - WS_ENDPOINT=https://ccg.stolenartifacts.org/api

networks:
  ccg-network:
